# Tier 0 / ADR-052: edge reverse proxy / TLS termination in front of the
# `web` service (which itself proxies /api/ to `api` internally -- see
# frontend/nginx.conf). Mounted read-only into the `proxy` service in
# docker-compose.prod.yml.
#
# This config assumes a certificate/key pair is mounted at
# /etc/nginx/certs/fullchain.pem and /etc/nginx/certs/privkey.pem (e.g. from
# certbot's /etc/letsencrypt/live/<domain>/ directory -- point TLS_CERT_DIR
# in .env at that directory and rename/symlink as needed, or adjust the
# paths below to match your CA's output). Obtaining the certificate itself
# (ACME/Let's Encrypt issuance, DNS validation, renewal cron) is
# environment/domain-specific and is intentionally NOT automated here --
# see docs/PRODUCTION_DEPLOYMENT_GUIDE.md for the manual steps.

server {
    listen 80;
    server_name _;
    # Redirect everything to HTTPS once a real certificate is in place.
    # Comment this out (and use plain port 80 below) if you are not yet
    # ready to serve HTTPS, e.g. local smoke-testing of this compose file.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
