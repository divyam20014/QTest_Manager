services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qtesthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-qtesthub}
    ports:
      - "5432:5432"
    volumes:
      - qtesthub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qtesthub} -d ${POSTGRES_DB:-qtesthub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # ADR-006: runtime connects as the least-privilege app role (no schema
      # DDL, no UPDATE/DELETE on audit_logs); migrations run as the owner.
      # APP_DB_PASSWORD must match what was set when migrations last ran
      # (see alembic/versions/c1d2e3f4a5b6_parameterize_app_role_password.py).
      DATABASE_URL: postgresql+psycopg://qtesthub_app:${APP_DB_PASSWORD:-qtesthub_app}@db:5432/${POSTGRES_DB:-qtesthub}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qtesthub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-qtesthub}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-qtesthub_app}
      # ADR-067: tenant-less login's identity-resolution lookup (POST
      # /auth/identify) needs a connection that bypasses RLS (SELECT-only,
      # on users/tenants) to find a user's tenant(s) by email before any
      # tenant_id is known. IDENTIFY_DB_PASSWORD must match what was set
      # when migrations last ran (see
      # alembic/versions/f1a2b3c4d5e6_add_identify_role_for_tenantless_login.py).
      IDENTIFY_DATABASE_URL: postgresql+psycopg://qtesthub_identify:${IDENTIFY_DB_PASSWORD:-qtesthub_identify}@db:5432/${POSTGRES_DB:-qtesthub}
      IDENTIFY_DB_PASSWORD: ${IDENTIFY_DB_PASSWORD:-qtesthub_identify}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MFA_DELIVERY_MODE: ${MFA_DELIVERY_MODE:-simulated}
      # AI Test Case Generator (ADR-045): Fernet key encrypting tenant AI
      # provider API keys at rest. Required to save/enable AI settings;
      # must stay stable across restarts or previously-saved keys become
      # undecryptable.
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:?Set AI_CREDENTIAL_ENCRYPTION_KEY in .env}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - qtesthub_attachments:/data/attachments
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Tier 1 / ADR-053: DB-backed background job queue worker (SR-6.10),
  # same image as `api`, different entrypoint. No Celery/Redis -- this
  # stack has no cache/broker layer (see app/core/rate_limit.py).
  worker:
    build:
      context: ./backend
    # Tier 4 / ADR-054: mirrors the api service's own CMD (backend/Dockerfile)
    # -- overriding `command:` bypasses that Dockerfile CMD entirely, so
    # without this the worker ran directly as root while api ran as the
    # unprivileged `app` user, leaving any file the worker wrote under
    # /data/attachments root-owned and unwritable by api afterward (the
    # bug that surfaced when the tenant-export job tried to create a
    # subdirectory there).
    command: ["sh", "-c", "chown -R app:app /data/attachments && su app -s /bin/sh -c 'python -m app.worker'"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://qtesthub_app:${APP_DB_PASSWORD:-qtesthub_app}@db:5432/${POSTGRES_DB:-qtesthub}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    # Tier 4 / ADR-054: the tenant-export job (and any future worker job
    # touching the local storage backend) reads/writes through
    # app/core/storage.py's LocalFilesystemStorage, which resolves to this
    # same path -- without this mount the worker and api containers each
    # see their own, unrelated filesystem, so a file the worker writes is
    # invisible to the api container that later serves its download.
    volumes:
      - qtesthub_attachments:/data/attachments
    # Deployment-hardening pass: `worker` otherwise inherits the api image's
    # Dockerfile HEALTHCHECK (an HTTP GET against /api/v1/ready), but this
    # container never serves HTTP -- that probe always failed, which is why
    # this service has shown Docker-level "unhealthy" since Tier 1 despite
    # processing jobs correctly. Checked for the polling loop's own process
    # instead.
    healthcheck:
      # No `pgrep`/procps in the python:3.12-slim base image -- this checks
      # /proc directly instead of adding an OS package just for this.
      test:
        - CMD-SHELL
        - |
          python -c "
          import glob, sys
          from contextlib import suppress
          found = False
          for f in glob.glob('/proc/[0-9]*/cmdline'):
              with suppress(OSError):
                  if b'app.worker' in open(f, 'rb').read():
                      found = True
                      break
          sys.exit(0 if found else 1)
          "
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qtesthub_pgdata:
  qtesthub_attachments:
