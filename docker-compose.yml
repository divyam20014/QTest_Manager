services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qtesthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-qtesthub}
    ports:
      - "5432:5432"
    volumes:
      - qtesthub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qtesthub} -d ${POSTGRES_DB:-qtesthub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # ADR-006: runtime connects as the least-privilege app role (no schema
      # DDL, no UPDATE/DELETE on audit_logs); migrations run as the owner.
      # APP_DB_PASSWORD must match what was set when migrations last ran
      # (see alembic/versions/c1d2e3f4a5b6_parameterize_app_role_password.py).
      DATABASE_URL: postgresql+psycopg://qtesthub_app:${APP_DB_PASSWORD:-qtesthub_app}@db:5432/${POSTGRES_DB:-qtesthub}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qtesthub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-qtesthub}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-qtesthub_app}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MFA_DELIVERY_MODE: ${MFA_DELIVERY_MODE:-simulated}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - qtesthub_attachments:/data/attachments
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  qtesthub_pgdata:
  qtesthub_attachments:
