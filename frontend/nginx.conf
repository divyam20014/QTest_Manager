# Tier 0 / ADR-052: serves the Vite static build and supports client-side
# routing (every unmatched path falls back to index.html, since this is a
# single-page app) plus proxies /api/ to the backend container by its
# compose service name.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Deployment-hardening pass: defense-in-depth alongside the edge proxy's
    # own copies of these (deploy/nginx/reverse-proxy.conf) -- this layer is
    # also reachable directly (e.g. docker-compose.prod.yml's health check,
    # or a deployment that fronts `web` without the edge proxy).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
