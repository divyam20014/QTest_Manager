[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's own idiom is Depends(...) as an argument default; this
# rule's premise (mutable default args) doesn't apply to FastAPI's DI system.
ignore = ["B008"]

# The demo seed script is mostly prose data (titles, descriptions, steps). Wrapping
# those strings by hand risks silently changing the seeded text, so only the
# line-length rule is relaxed for that one file.
[tool.ruff.lint.per-file-ignores]
"scripts/seed_demo_tenant.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
# Domain model names (TestCase, TestRun, ...) collide with pytest's default
# "Test*" class-discovery heuristic; only app/tests are actual test modules.
python_files = "tests/test_*.py"
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
